[project]
name = "assistente"
version = "0.1.0"
description = "Assistente jurídico do GAA para recuperação de crédito"
readme = "README.md"
authors = [
    { name = "Henrique Borges Rodrigues" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integracao: testes que dependem de rede ou serviço externo"]

[tool.mypy]
python_version = "3.12"
packages = ["assistente"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "assistente.dominio.*"
strict = true
