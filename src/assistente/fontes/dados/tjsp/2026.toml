# Calendário forense do TJSP para 2026.
#
# Os feriados nacionais, a terça-feira de Carnaval e a Sexta-feira Santa
# vêm do código (Lei 1.408/1951, art. 5º) e não se repetem aqui.
#
# conferido = false até Henrique confirmar cada data. Enquanto false, todo
# prazo calculado com esta tabela sai com aviso.
# Tipos: feriado, suspensao_expediente, suspensao_prazo,
# expediente_irregular, indisponibilidade.

